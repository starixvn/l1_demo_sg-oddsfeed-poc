<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Demo</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="HTML5 Example Page" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />

  <link rel="stylesheet" href="styles/icons.css" />
  <link rel="stylesheet" href="styles/demo.css" />
</head>

<body>
  <div class="page">
    <div class="header">
      <select class="form-select dropdown" aria-label="Theme" onchange="index.changeTheme(this);">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
      <select class="form-select dropdown" aria-label="Languages" onchange="index.changeLanguage(this);">
        <option value="en">English</option>
        <option value="tw">繁體中文</option>
        <option value="cn">日本語</option>
        <option value="vi">Tiếng Việt</option>
      </select>
      <button class="btn btn-secondary">Result</button>
      <select class="form-select dropdown" aria-label="Odds" onchange="index.changeOddsType(this);">
        <option value="DEC" selected>Decimal Odds</option>
        <option value="MY">Malay Odds</option>
        <option value="HK">Hong Kong Odds</option>
      </select>
      <button class="btn btn-secondary" onclick="index.changeQuickBet();">Quick Bet</button>
    </div>
    <div class="content">
      <div class="left-area">
        <div class="account-side">
          <div class="block-header">
            <div class="left">
              <span class="icon icon--account"></span>
              <div class="title">Supertest</div>
            </div>

            <div class="right">
              <span class="icon icon--refresh"></span>
              <span class="icon icon--email"></span>
              <span class="icon icon--arrow-down"></span>
            </div>
          </div>
          <div class="account-list">
            <div class="account-option">
              <div class="text">Bet Credit</div>
              <div class="value">
                <span class="currency">UUS</span>
                <span class="amount" id="player-balance">1,871</span>
              </div>
            </div>
            <div class="account-option">
              <div class="text">Cash Balance</div>
              <div class="value">
                <span class="currency">UUS</span>
                <span class="amount negative">-328</span>
              </div>
            </div>
          </div>
        </div>

        <div class="bet-cart">
          <div class="block-header">
            <ul class="tabs">
              <li class="tab selected">Bet Slip</li>
              <li class="tab">Bet List</li>
            </ul>
          </div>
          <div class="container">
            <div class="betting-board-left" id="betting-board-left">
              <!-- <div class="category">
                SABA.Games / Big Small
                <div>
                  <span class="icon icon--arrow-down"></span>
                  <span class="icon icon--clear"></span>
                </div>
              </div>
              <div class="bet-choice">Small @ <strong>1.96</strong> (Dec)</div>

              <div class="form-bet">
                <span class="currency">UUS</span>
                <input class="text-box-bet" type="text" value="1" />
              </div>

              <div class="payout">
                <span>Payout</span>
                <span>0.00</span>
              </div>
              <div class="bet-info">Big Small Round 10876</div>
              <div class="product-name">SABA.Games</div>
              <button class="btn btn-bet">Bet</button>
              <button class="btn btn-clear">Clear All</button> -->
            </div>
            <div class="bet-setting">
              <span class="icon icon--bet-setting"></span> Bet Settings
            </div>
            <hr />
            <a class="how-to-use" href="#">How to Use <span class="icon icon--help-outline"></span></a>
          </div>
        </div>
      </div>
      <div class="main-area">
        <iframe id="remote-iframe" width="100%" height="500px" src=""></iframe>
        <iframe id="sg-game-iframe" width="100%" height="100px" src="./sg-game.html"></iframe>
      </div>
      <div class="right-area">
        <div class="banner-1">
          <img src="images/1.png" alt="Banner 1" />
        </div>
        <div class="banner-2">
          <img src="images/2.png" alt="Banner 2" />
        </div>
        <div class="banner-3">
          <img src="images/3.png" alt="Banner 3" />
        </div>
      </div>
    </div>
  </div>

  <div id="betting-board-fly" style="display: none;">
    <div id="betting-board">
      <div class="category">
        SABA.Games /&nbsp<span id="game-name"></span>
        <div class="bet-board-icons">
          <span class="icon icon--arrow-down"></span>
          <span class="icon icon--clear" onclick="index.hideBettingBoard();"></span>
        </div>
      </div>
      <div class="bet-choice"><span id="chocie-name">Small</span> @ <strong id="odds-value">1.96</strong> (Dec)</div>

      <div class="form-bet">
        <span class="currency">UUS</span>
        <input class="text-box-bet" type="number" value="1" id="txtBetValue" onchange="index.changeBetAmount(this);"
          onkeydown="index.changeBetAmount(this);" />
      </div>

      <div class="payout">
        <span>Payout</span>
        <span class="payout-value">0.00</span>
      </div>
      <div class="bet-info">Big Small Round <span id="game-round-id"></span></div>
      <div class="product-name">SABA.Games</div>
      <button class="btn btn-bet" id="btnFlyBet" onclick="index.placeBet();">Bet</button>
      <button class="btn btn-clear" onclick="index.hideBettingBoard();">Clear All</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.2/axios.min.js"
    integrity="sha512-JSCFHhKDilTRRXe9ak/FJ28dcpOJxzQaCd3Xg8MyF6XFjODhy/YMCM8HW0TFDckNHWUewW+kfvhin43hKtJxAw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src='./scripts/index.js' type="text/javascript"></script>
</body>

</html>
