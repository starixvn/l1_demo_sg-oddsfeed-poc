<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>

<body>
    <button style="margin-left: 200px;" id="btn-place-bet" type="button" onclick="placeBet();">Bet</button>
    <button style="margin-left: 200px;" id="btn-place-bet" type="button" onclick="syncBalance();">Sync Balance</button>
</body>
<script type="text/javascript">
    function getOffset(element) {
        const rect = element.getBoundingClientRect();
        return {
            left: rect.left + window.scrollX + rect.width / 2,
            top: rect.top + window.scrollY + rect.height + 3,

        };
    }

    function placeBet() {
        const placeBetBtn = document.getElementById("btn-place-bet");
        const placeBetPosition = getOffset(placeBetBtn);
        console.log("child", placeBetPosition);

        window.parent.postMessage({
            from: "iframe",
            name: "placeBet",
            data: {
                amount: 10,
                choiceId: 1,
                choiceName: "Small",
                position: placeBetPosition,
                gameName: "Big Small",
                gameRoundId: 1111,
                odds: 1.95
            }
        }, "*");
    }

    function syncBalance() {
        window.parent.postMessage({
            from: "iframe",
            name: "syncBalance",
            data: {
                balance: 11256.24,
            }
        }, "*");
    }

    window.addEventListener("message", (event) => {
        if (event.data.from === "ms") {
            console.log("child received postMessage", event.data);
        }
    }, false);
</script>

</html>
